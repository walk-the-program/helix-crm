[package]
name = "helix-crm"
version = "0.1.0"
description = "Helix CRM: a local-first desktop CRM for trade and service businesses"
authors = ["ClearPath Digital"]
license = "AGPL-3.0-only"
repository = "https://github.com/clearpathdigital/helix-crm"
edition = "2021"
rust-version = "1.82"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "helix_crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-log = "2.9.1"
tauri-plugin-http = "2.6.1"

# One bundled SQLCipher so Windows needs no system library, and so better-sqlite3 in the
# JS test harness can be pinned to the same SQLite major. `bundled-sqlcipher-vendored-openssl`
# statically links SQLCipher *and* builds OpenSSL from source, so every workspace file is
# encrypted at rest (docs/PLAN.md "Security and threat model", D18) with no system
# dependency on any platform. The amalgamation keeps FTS5; there is a test that asserts it.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }

# The OS CSPRNG (getentropy on macOS, BCryptGenRandom on Windows) for the 32-byte
# per-workspace database key. Already in the tree via uuid/reqwest, so this pulls in
# nothing new.
getrandom = "0.3.4"

# keyring 3 ships no backend by default; the native ones are selected explicitly.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }

# Pinned to 0.12 to match the reqwest that tauri-plugin-http already links, so only one
# copy of reqwest is compiled. rustls only: no OpenSSL/Schannel dependency.
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls",
  "json",
] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.20"
base64 = "0.23.1"
mime_guess = "2.0.5"
uuid = { version = "1.26.1", features = ["v7"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.4"

[dev-dependencies]
tempfile = "3.24.0"
# The integration tests write a *plaintext* database by hand (no PRAGMA key, so
# SQLCipher behaves as plain SQLite) to exercise the one-time migration, and open
# backups directly to prove they came out encrypted. Same version and features as
# the dependency above, so Cargo unifies them and nothing extra is compiled.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
