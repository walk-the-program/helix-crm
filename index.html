<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/helix-logo.png" />
    <!--
      The two files the first frame actually sets: the heading bold the lockup
      and the page title are in, and the body regular everything else is in.

      These two lines are DERIVED from the font switch at the top of
      src/styles/tokens.css. Move the switch and move these with it, or the
      app preloads a face it no longer wears and swaps into the one it does.
      Today: DM Sans 700 for headings, Lato 400 for body.

      Every family is self-hosted in public/fonts and declared in
      src/styles/fonts.css. The app is offline, so these are the only font
      requests the window ever makes; the remaining weights load on demand.
    -->
    <link
      rel="preload"
      href="/fonts/dm-sans-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/lato-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=1024, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Helix CRM</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
