<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/helix-logo.png" />
    <!--
      The two faces the first frame actually sets: the Zilla Slab the lockup
      and the page title are in, and the Poppins regular everything else is in.
      Self-hosted in public/fonts; the app is offline, so there is no CDN and
      these are the only font requests the window ever makes. The other three
      weights (Zilla 600, Poppins 500/600) load on demand.
    -->
    <link
      rel="preload"
      href="/fonts/zilla-slab-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=1024, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Helix CRM</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
