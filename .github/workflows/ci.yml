name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # LR-SEC measured production (non-dev) advisories at zero (sec.md §7.1).
      # --omit=dev keeps that true without forcing a semver-major downgrade of
      # drizzle-kit over the esbuild dev-server advisory that only affects
      # `npm run` migration tooling and never ships (sec.md F-SEC-36). This is
      # a read-only npm registry query already implied by `npm ci` above; no
      # new tool, no cost, free on a public repo.
      - name: npm audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

  # LR-LA F-LA-1. The Playwright suite - the largest one in the repo, and the
  # only automated cover the UI has at all - ran nowhere but a developer's own
  # machine. `ci.yml` had `js` (typecheck, vitest, npm audit) and `rust`;
  # `e2e-win.yml` runs four Windows smoke assertions. So every screen this
  # round built (payments, Schedule, automations, bulk actions, the recovery
  # key card) could regress on main and every check would stay green, and
  # release.yml cuts an installer from exactly that main. A suite nobody runs
  # is a suite that is already broken; this is the job that makes the count in
  # the launch record mean something between rounds.
  #
  # macos-latest rather than ubuntu-latest, although the harness is
  # platform-neutral (Chromium plus better-sqlite3, no Tauri runtime): macOS is
  # where the suite is developed and where it has been run, `hig.e2e.ts`
  # reasons about the macOS window chrome, and dates, fonts and locale are the
  # three things a Linux runner would quietly disagree about. Free for a public
  # repo, and the suite builds and previews itself, so there is nothing to
  # cache and no service to stand up.
  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      # Only Chromium: the config declares one project and the suite has never
      # been run against another engine, so pulling three browsers would be
      # three times the download for no extra coverage.
      - run: npx playwright install --with-deps chromium

      - run: npm run e2e:mac

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: tests/e2e-mac/.cache/report*
          retention-days: 7

  # Ubuntu is deliberately excluded from this matrix: Tauri's Linux build
  # depends on system packages (webkit2gtk, libappindicator, etc.) that are
  # not installed in this project's CI setup yet, so `cargo test` would fail
  # before it even gets to our code. macOS and Windows runners ship the
  # toolchains Tauri needs out of the box, so they're sufficient for now.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # `cargo audit` is not installed on any of our machines and nobody has run
  # it against src-tauri's dependency tree (sec.md §7.2: LR-SEC explicitly
  # left this to CI rather than installing tooling locally). rustsec/audit-check
  # wraps cargo-audit and runs it against src-tauri/Cargo.lock. Pinned to the
  # `v2` major-version ref (github.com/rustsec/audit-check, branch v2, matches
  # release v2.0.0), same convention as actions/checkout@v4 elsewhere in this
  # repo. On a push/pull_request trigger (not `schedule`) the action only
  # fails the check for a new advisory; it does not open GitHub issues -
  # issue creation is a scheduled-run-only behavior we are not using, so no
  # `issues:` permission is requested. `checks: write` is the one permission
  # the action needs, to publish its pass/fail check; nothing else is
  # granted. Free for a public repo: one more job on the existing runners,
  # no artifacts, no third-party service.
  rust-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
